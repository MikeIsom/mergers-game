	<rect x="35" y="0" width="30" height="30" fill="#a6a6a6" />
	<rect x="70" y="0" width="30" height="30" fill="#21c5e2" />
	<rect x="0" y="35" width="30" height="30" fill="#b44906" />
	<rect x="36.5" y="36.5" width="27" height="27" fill="#1e1e1e" stroke="#a6a6a6" stroke-width="3" />
	<rect x="70" y="35" width="30" height="30" fill="#21c5e2" />
	<rect x="0" y="70" width="30" height="30" fill="#b44906" />
	<rect x="35" y="70" width="30" height="30" fill="#a6a6a6" />
	<rect x="70" y="70" width="30" height="30" fill="#21c5e2" />
</svg>
