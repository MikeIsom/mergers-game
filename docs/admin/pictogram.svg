<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
	<title>Acquire</title>
	<!-- A corner of the board: a Tower group (orange) and a Continental group (cyan) with the
	     loose tile between them that will merge them. Our own chain colours, no edition artwork. -->
